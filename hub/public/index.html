<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Join the Light Show</title>
  <style>
    :root { --fg: rgba(255,255,255,0.92); --muted: rgba(255,255,255,0.72); }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1000px 700px at 50% 20%, #1b2b44 0%, #05070c 70%, #000 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%; max-width: 520px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 8px 0; font-size: 24px; }
    p { margin: 0 0 16px 0; color: var(--muted); line-height: 1.35; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      padding: 14px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      font-size: 18px;
      font-weight: 650;
    }
    button:active { transform: scale(0.98); }
    .small { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.65); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Join the Light Show</h1>
    <p>Pick what you want to lean into tonight:</p>

    <div class="grid">
      <button data-answer="hope">Hope</button>
      <button data-answer="peace">Peace</button>
      <button data-answer="joy">Joy</button>
      <button data-answer="strength">Strength</button>
    </div>

    <div class="small" id="status"></div>
  </div>

<script type="module">
  const statusEl = document.getElementById("status");
  const buttons = [...document.querySelectorAll("button[data-answer]")];

  const existingToken = localStorage.getItem("showToken");
  if (existingToken) location.href = `/show.html?token=${encodeURIComponent(existingToken)}`;

  async function submit(answer) {
    statusEl.textContent = "Joining…";
    buttons.forEach(b => b.disabled = true);

    const res = await fetch("/api/survey", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer })
    });

    if (!res.ok) {
      statusEl.textContent = "Something went wrong. Please try again.";
      buttons.forEach(b => b.disabled = false);
      return;
    }

    const data = await res.json();
    localStorage.setItem("showToken", data.token);
    location.href = `/show.html?token=${encodeURIComponent(data.token)}`;
  }

  buttons.forEach(btn => btn.addEventListener("click", () => submit(btn.dataset.answer)));
</script>
</body>
</html>
